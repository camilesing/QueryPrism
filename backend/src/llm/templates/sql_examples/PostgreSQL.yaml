examples:
  - question: Count the number of users grouped by status
    sql: SELECT status, COUNT(*) AS cnt FROM users GROUP BY status
  - question: List the top 5 products by sales amount
    sql: SELECT product_name, SUM(amount) AS total FROM sales GROUP BY product_name ORDER BY total DESC LIMIT 5
  - question: Show the number of orders created each month this year
    sql: SELECT TO_CHAR(created_at, 'YYYY-MM') AS month, COUNT(*) AS cnt FROM orders WHERE EXTRACT(YEAR FROM created_at) = EXTRACT(YEAR FROM CURRENT_DATE) GROUP BY month ORDER BY month
  - question: Total 2024 spend per customer, top 100 customers by amount
    badSql: |
      SELECT t.customer_id, SUM(t.amount) AS total_amount
      FROM (SELECT customer_id, amount FROM orders WHERE create_time >= '2024-01-01' LIMIT 100) t
      GROUP BY t.customer_id
      -- WRONG: the LIMIT inside the derived table makes the aggregation run
      -- over only 100 truncated rows, so the totals are wrong
    sql: |
      SELECT o.customer_id, SUM(o.amount) AS total_amount
      FROM orders o
      WHERE o.create_time >= '2024-01-01'
      GROUP BY o.customer_id
      ORDER BY total_amount DESC
      LIMIT 100
